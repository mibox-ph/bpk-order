plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bpk.customer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bpk.customer'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
